services:
  postgres:
    image: postgres:17-alpine
    container_name: shoestore-postgres
    environment:
      POSTGRES_DB: shoestore
      POSTGRES_USER: shoestore
      POSTGRES_PASSWORD: shoestore_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: